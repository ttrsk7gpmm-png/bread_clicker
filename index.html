<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garage Clicker</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
min-height:100vh;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(
180deg,
#1c1c1c 0%,
#111 100%
);
z-index:-2;
}

body::after{
content:"";
position:fixed;
width:500px;
height:500px;
border-radius:50%;
background:rgba(255,140,0,.15);
filter:blur(120px);
left:50%;
top:-200px;
transform:translateX(-50%);
z-index:-1;
}

#game{
max-width:700px;
margin:auto;
padding:15px;
}

.top{
display:flex;
gap:10px;
margin-bottom:15px;
}

.panel{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:15px;
}

.moneyPanel{
flex:1;
}

.levelPanel{
width:120px;
text-align:center;
}

.label{
font-size:12px;
opacity:.7;
margin-bottom:6px;
}

.money{
font-size:30px;
font-weight:bold;
color:#ffb347;
}

.garage{
margin-bottom:15px;
}

.garageTitle{
font-size:22px;
font-weight:bold;
margin-bottom:8px;
}

.progress{
height:14px;
background:#2b2b2b;
border-radius:999px;
overflow:hidden;
margin-top:10px;
}

.progressFill{
height:100%;
width:0%;
background:
linear-gradient(
90deg,
#ff8c00,
#ffb347
);
}

.bikeArea{
height:280px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

#bike{
font-size:120px;
cursor:pointer;
transition:.08s;
user-select:none;
}

#bike:active{
transform:scale(.92);
}

.bikeName{
font-size:24px;
font-weight:bold;
margin-top:10px;
}

.bikeStage{
opacity:.8;
margin-top:5px;
}

.section{
margin-top:15px;
font-size:20px;
margin-bottom:10px;
}

.shop{
display:flex;
flex-direction:column;
gap:12px;
}

.shopCard{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:18px;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.buy{
border:none;
padding:12px 16px;
border-radius:14px;
font-weight:bold;
background:
linear-gradient(
135deg,
#ff8c00,
#ffb347
);
color:black;
}

.footer{
margin-top:20px;
text-align:center;
opacity:.6;
font-size:13px;
}

.floating{
position:fixed;
pointer-events:none;
font-weight:bold;
color:#ffb347;
animation:floatUp .9s forwards;
}

@keyframes floatUp{
0%{
opacity:1;
transform:translateY(0);
}
100%{
opacity:0;
transform:translateY(-80px);
}
}

</style>
</head>

<body>

<div id="game">

<div class="top">

<div class="panel moneyPanel">
<div class="label">ШЕСТЕРЁНКИ</div>
<div class="money">
⚙️ <span id="money">0</span>
</div>
</div>

<div class="panel levelPanel">
<div class="label">УРОВЕНЬ</div>
<div id="playerLevel">1</div>
</div>

</div>

<div class="panel garage">

<div class="garageTitle">
🏚️ Заброшенный гараж
</div>

<div id="garageText">
Лужи на полу и старая крыша
</div>

<div class="progress">
<div
class="progressFill"
id="garageProgress">
</div>
</div>

</div>

<div class="bikeArea">

<div id="bike">
🛵
</div>

<div
class="bikeName"
id="bikeName">
Старый скутер
</div>

<div
class="bikeStage"
id="bikeStage">
Этап 0 / 20
</div>

</div>

<div class="section">
🔧 Улучшения
</div>

<div class="shop">

<div class="shopCard">

<div>
<div><b>🔩 Улучшить технику</b></div>
<div id="bikeUpgradeText">
Отмыть скутер
</div>
</div>

<button
class="buy"
onclick="upgradeBike()">
⚙️ <span id="bikeCost">50</span>
</button>

</div>

<div class="shopCard">

<div>
<div><b>🏚️ Улучшить гараж</b></div>
<div id="garageUpgradeText">
Убрать мусор
</div>
</div>

<button
class="buy"
onclick="upgradeGarage()">
⚙️ <span id="garageCost">75</span>
</button>

</div>

</div>

<div class="footer">
TikTok @xleebuusheek
</div><script>

const bikes = [
"🛵 Старый скутер",
"🏍️ Старый мотоцикл",
"🏍️ Альфа",
"🏍️ Питбайк",
"🏍️ Эндуро",
"🏍️ Спортбайк"
];

const bikeStages = [
"Отмыть технику",
"Убрать ржавчину",
"Починить сиденье",
"Поставить зеркало",
"Поменять руль",
"Починить фару",
"Новая ручка газа",
"Подкачать колеса",
"Почистить двигатель",
"Новый трос",
"Подкрасить пластик",
"Новый глушитель",
"Новая цепь",
"Новая приборка",
"Покраска деталей",
"Замена пластика",
"Усиление подвески",
"Настройка двигателя",
"Полировка",
"Полное восстановление"
];

const garageStages = [
"Убрать мусор",
"Убрать лужи",
"Залатать крышу",
"Повесить лампу",
"Новый удлинитель",
"Поставить полку",
"Организовать инструменты",
"Покрасить стену",
"Поставить шкаф",
"Поставить верстак",
"Новый свет",
"Купить компрессор",
"Купить домкрат",
"Повесить плакаты",
"Положить покрытие",
"Новый стеллаж",
"Купить мойку",
"Купить генератор",
"Установить подъемник",
"Отличный гараж"
];

let money =
Number(localStorage.getItem("money")) || 0;

let bikeLevel =
Number(localStorage.getItem("bikeLevel")) || 0;

let garageLevel =
Number(localStorage.getItem("garageLevel")) || 0;

let playerLevel =
Number(localStorage.getItem("playerLevel")) || 1;

let clickPower =
Number(localStorage.getItem("clickPower")) || 1;

function saveGame(){

localStorage.setItem(
"money",
money
);

localStorage.setItem(
"bikeLevel",
bikeLevel
);

localStorage.setItem(
"garageLevel",
garageLevel
);

localStorage.setItem(
"playerLevel",
playerLevel
);

localStorage.setItem(
"clickPower",
clickPower
);

}

function currentBikeIndex(){

return Math.floor(
bikeLevel / 20
);

}

function currentBikeStage(){

return bikeLevel % 20;

}

function bikePrice(){

return Math.floor(
50 + bikeLevel * 35
);

}

function garagePrice(){

return Math.floor(
75 + garageLevel * 45
);

}function createFloatingGear(x,y){

const gear =
document.createElement("div");

gear.className = "floating";

gear.innerHTML = "⚙️ +" + clickPower;

gear.style.left = x + "px";
gear.style.top = y + "px";

document.body.appendChild(gear);

setTimeout(()=>{
gear.remove();
},900);

}

function updateUI(){

document.getElementById("money")
.innerText =
Math.floor(money);

document.getElementById("playerLevel")
.innerText =
playerLevel;

const bikeIndex =
Math.min(
currentBikeIndex(),
bikes.length-1
);

document.getElementById("bikeName")
.innerText =
bikes[bikeIndex];

document.getElementById("bikeStage")
.innerText =
"Этап " +
(currentBikeStage()) +
" / 20";

document.getElementById("bikeCost")
.innerText =
bikePrice();

document.getElementById("garageCost")
.innerText =
garagePrice();

document.getElementById("bikeUpgradeText")
.innerText =
bikeStages[
currentBikeStage()
];

document.getElementById("garageUpgradeText")
.innerText =
garageStages[
garageLevel % 20
];

document.getElementById("garageProgress")
.style.width =
((garageLevel % 20)/20)*100
+ "%";

saveGame();

}

document
.getElementById("bike")
.addEventListener(
"click",
function(e){

money += clickPower;

createFloatingGear(
e.pageX,
e.pageY
);

updateUI();

}
);

function upgradeBike(){

const cost =
bikePrice();

if(money < cost)
return;

money -= cost;

bikeLevel++;

if(
bikeLevel % 5 === 0
){
clickPower++;
}

if(
bikeLevel % 20 === 0
){
playerLevel++;
}

updateUI();

}

function upgradeGarage(){

const cost =
garagePrice();

if(money < cost)
return;

money -= cost;

garageLevel++;

updateUI();

}

updateUI();

</script>

</body>
</html>
