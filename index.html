<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bread Clicker</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(
180deg,
#f8e8c7 0%,
#f1d4a6 50%,
#d9b382 100%
);
}

#game{
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
padding:20px;
}

.top-card{
width:95%;
max-width:450px;
background:rgba(255,255,255,.35);
backdrop-filter:blur(10px);
border-radius:25px;
padding:15px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.money-title{
font-size:18px;
opacity:.7;
}

.money{
font-size:38px;
font-weight:bold;
margin-top:5px;
}

.persec{
margin-top:5px;
opacity:.7;
}

.click-zone{
flex:1;
display:flex;
align-items:center;
justify-content:center;
width:100%;
position:relative;
}

#bread{
font-size:180px;
cursor:pointer;
user-select:none;
transition:.08s;
filter:drop-shadow(0 10px 15px rgba(0,0,0,.25));
}

#bread:active{
transform:scale(.92);
}

.floating{
position:absolute;
font-size:28px;
font-weight:bold;
pointer-events:none;
animation:floatUp .9s forwards;
}

@keyframes floatUp{
0%{
opacity:1;
transform:translateY(0);
}
100%{
opacity:0;
transform:translateY(-80px);
}
}

.shop{
width:95%;
max-width:500px;
display:flex;
flex-direction:column;
gap:12px;
margin-bottom:15px;
}

.card{
background:rgba(255,255,255,.35);
backdrop-filter:blur(10px);
border-radius:20px;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.buy{
border:none;
background:#ffb347;
padding:10px 15px;
border-radius:12px;
font-weight:bold;
}

.buy:active{
transform:scale(.95);
}

.author{
font-size:14px;
opacity:.7;
margin-bottom:10px;
}
</style>
</head>

<body>

<div id="game">

<div class="top-card">
<div class="money-title">Баланс</div>
<div class="money" id="money">0</div>
<div class="persec">⚡ <span id="persec">0</span>/сек</div>
</div>

<div class="click-zone">
<div id="bread">🍞</div>
</div>

<div class="shop">

<div class="card">
<div>
<b>👆 Сила клика</b><br>
+1 за нажатие
</div>
<button class="buy" onclick="buyClick()">
Цена: <span id="clickCost">10</span>
</button>
</div>

<div class="card">
<div>
<b>🤖 Авто-кликер</b><br>
+1 в секунду
</div>
<button class="buy" onclick="buyAuto()">
Цена: <span id="autoCost">50</span>
</button>
</div>

</div>

<div class="author">
TikTok @xleebuusheek
</div>

</div>

<script>

let bread =
Number(localStorage.getItem("bread")) || 0;

let clickPower =
Number(localStorage.getItem("clickPower")) || 1;

let autoPower =
Number(localStorage.getItem("autoPower")) || 0;

let clickCost =
Number(localStorage.getItem("clickCost")) || 10;

let autoCost =
Number(localStorage.getItem("autoCost")) || 50;

function save(){
localStorage.setItem("bread",bread);
localStorage.setItem("clickPower",clickPower);
localStorage.setItem("autoPower",autoPower);
localStorage.setItem("clickCost",clickCost);
localStorage.setItem("autoCost",autoCost);
}

function update(){

document.getElementById("money").innerText =
Math.floor(bread);

document.getElementById("persec").innerText =
autoPower;

document.getElementById("clickCost").innerText =
clickCost;

document.getElementById("autoCost").innerText =
autoCost;

save();
}

function floatText(x,y,text){

const div=document.createElement("div");

div.className="floating";

div.innerText=text;

div.style.left=x+"px";
div.style.top=y+"px";

document.body.appendChild(div);

setTimeout(()=>{
div.remove();
},900);

}

document.getElementById("bread")
.addEventListener("click",(e)=>{

bread+=clickPower;

floatText(
e.pageX,
e.pageY,
"+"+clickPower
);

update();

});

function buyClick(){

if(bread<clickCost)return;

bread-=clickCost;

clickPower++;

clickCost=Math.floor(clickCost*1.8);

update();

}

function buyAuto(){

if(bread<autoCost)return;

bread-=autoCost;

autoPower++;

autoCost=Math.floor(autoCost*2);

update();

}

setInterval(()=>{

bread+=autoPower;

update();

},1000);

update();

</script>

</body>
</html>
